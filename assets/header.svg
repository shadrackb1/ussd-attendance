<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160">
  <rect width="720" height="160" fill="#0D1117"/>
  <!-- phone frame -->
  <rect x="40" y="18" width="100" height="130" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <rect x="55" y="36" width="70" height="28" rx="4" fill="#0D1117"/>
  <text x="90" y="54" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#3FB950">*384*9#</text>
  <!-- keypad -->
  <g fill="#21262D">
    <circle cx="65" cy="80" r="6"/><circle cx="90" cy="80" r="6"/><circle cx="115" cy="80" r="6"/>
    <circle cx="65" cy="100" r="6"/><circle cx="90" cy="100" r="6"><animate attributeName="fill" values="#21262D;#1F6FEB;#21262D" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="115" cy="100" r="6"/>
    <circle cx="65" cy="120" r="6"/><circle cx="90" cy="120" r="6"/><circle cx="115" cy="120" r="6"/>
  </g>
  <!-- signal waves -->
  <g fill="none" stroke="#1F6FEB" stroke-width="1.5">
    <path d="M160 80 Q200 40 240 80" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M160 80 Q220 20 280 80" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M160 80 Q240 0 320 80" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="360" y="70" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#E6EDF3">USSD Attendance</text>
  <text x="360" y="100" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8B949E">works on any phone. no app. no camera. no data bundle.</text>
  <text x="360" y="125" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3FB950">session open Â· dial *384*SESSION#</text>
</svg>
